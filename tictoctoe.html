<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        #status {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 8px;
            margin-bottom: 20px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #2d2d44;
            border: none;
            border-radius: 10px;

            color: white;
            font-size: 40px;
            font-weight: bold;

            cursor: pointer;
        }

        .cell:hover {
            background: #3b3b58;
        }

        #restart {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;

            background: #4caf50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #restart:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>❌ Tic Tac Toe ⭕</h1>

        <p id="status">Player X's Turn</p>

        <div class="board">

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

        </div>

        <button id="restart">Restart Game</button>

    </div>


    <script>

        // Get all cells
        const cells = document.querySelectorAll(".cell");

        // Get status text
        const status = document.getElementById("status");

        // Get restart button
        const restartButton = document.getElementById("restart");


        // Current player
        let currentPlayer = "X";

        // Game running or not
        let gameRunning = true;

        // Board data
        let board = ["", "", "", "", "", "", "", ""];


        // Winning combinations
        const winningPatterns = [

            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]

        ];


        // Add click event to every cell
        cells.forEach((cell, index) => {

            cell.addEventListener("click", () => {

                if (board[index] !== "" || !gameRunning) {
                    return;
                }

                board[index] = currentPlayer;

                cell.textContent = currentPlayer;

                checkWinner();

            });

        });


        // Check winner
        function checkWinner() {

            let winner = null;

            for (let pattern of winningPatterns) {

                const a = pattern[0];
                const b = pattern[1];
                const c = pattern[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {

                    winner = board[a];

                    break;
                }
            }


            // Winner found
            if (winner) {

                status.textContent = `🎉 Player ${winner} Wins!`;

                gameRunning = false;

                return;
            }


            // Check draw
            if (!board.includes("")) {

                status.textContent = "🤝 It's a Draw!";

                gameRunning = false;

                return;
            }


            // Change player
            currentPlayer = currentPlayer === "X" ? "O" : "X";

            status.textContent = `Player ${currentPlayer}'s Turn`;

        }


        // Restart game
        restartButton.addEventListener("click", restartGame);


        function restartGame() {

            board = ["", "", "", "", "", "", "", ""];

            currentPlayer = "X";

            gameRunning = true;

            status.textContent = "Player X's Turn";


            cells.forEach(cell => {

                cell.textContent = "";

            });

        }

    </script>

</body>
</html>
